<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Perspective Map: lay out all sides of a situation before you ask an AI. An open-source thinking framework.">
<meta name="author" content="Fantasia Skadi Candy">
<title>Perspective Map</title>
<style>
/* Layout: a worksheet — the event and choices on the left, the assembled prompt / answer on the right; one column on phones. */
:root {
  --bg: #f1f3f6;
  --panel: #ffffff;
  --ink: #1b2230;
  --muted: #5a6476;
  --line: #d4dae4;
  --accent: #245b8f;
  --accent-soft: #e3edf7;
  --warn: #8a5a00;
  --display: "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --body: "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #9aa5b6; --line: #2d3644; --accent: #8fbbe8; --accent-soft: #1f2d3d; --warn: #e8b85c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #9aa5b6; --line: #2d3644; --accent: #8fbbe8; --accent-soft: #1f2d3d; --warn: #e8b85c; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.7; }
.wrap {
  max-width: 1120px; margin: 0 auto; display: grid; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
header { display: grid; gap: 4px; max-width: 70ch; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--accent); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: .04em; }
.lede { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
h2 .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
textarea, input[type=text], input[type=password], select {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
textarea { min-height: 96px; resize: vertical; }
textarea.out { min-height: 300px; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; background: var(--bg); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.steps { display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; }
.step input { margin-top: 5px; accent-color: var(--accent); }
.step small { display: block; color: var(--muted); font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.field { display: grid; gap: 4px; flex: 1 1 180px; }
.field label { font-size: 13px; color: var(--muted); }
button { font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 200px; font-size: 14.5px; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--warn); }
details { font-size: 14px; color: var(--muted); }
summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.sample { font-size: 12px; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; }
.foot { color: var(--muted); font-size: 13px; margin: 0; max-width: 80ch; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: none; border-radius: 0; padding: 4px 12px; font-size: 13px; background: var(--panel); color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <header>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
    </header>
    <div class="lang" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="zh" aria-pressed="false">简体中文</button>
    </div>
  </div>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <h2><span class="n">1</span><span data-t="s1"></span></h2>
        <div class="row" id="sampleRow"><span class="sample" data-t="sampleTag"></span><span class="note" data-t="sampleNote"></span></div>
        <textarea id="event" data-t-aria="s1"></textarea>
        <p class="note" data-t="s1note"></p>
      </section>

      <section class="panel">
        <h2><span class="n">2</span><span data-t="s2"></span></h2>
        <p class="note" data-t="s2note"></p>
        <div class="chips" id="lenses"></div>
      </section>

      <section class="panel">
        <h2><span class="n">3</span><span data-t="s3"></span></h2>
        <div class="steps" id="steps"></div>
      </section>

      <section class="panel">
        <h2><span class="n">4</span><span data-t="s4"></span><span class="note" data-t="optional"></span></h2>
        <p class="note" data-t="s4note"></p>
        <textarea id="values" data-t-ph="s4ph"></textarea>
        <div class="row">
          <div class="field"><label for="depth" data-t="depth"></label>
            <select id="depth"><option value="brief" data-t="brief"></option><option value="full" data-t="full"></option></select></div>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-prompt" aria-selected="true" aria-controls="pane-prompt" data-t="tabPrompt"></button>
          <button type="button" role="tab" id="tab-api" aria-selected="false" aria-controls="pane-api" data-t="tabApi"></button>
        </div>

        <div id="pane-prompt" role="tabpanel" aria-labelledby="tab-prompt" class="col">
          <p class="note" data-t="promptNote"></p>
          <textarea id="prompt" class="out" readonly data-t-aria="tabPrompt"></textarea>
          <div class="row"><button type="button" class="primary" id="copy" data-t="copy"></button><span class="status" id="copyStatus"></span></div>
        </div>

        <div id="pane-api" role="tabpanel" aria-labelledby="tab-api" class="col" hidden>
          <p class="note" data-t="apiNote"></p>
          <div class="row">
            <div class="field"><label for="kind" data-t="kind"></label>
              <select id="kind"><option value="openai" data-t="kindOpenai"></option><option value="anthropic">Anthropic</option></select></div>
          </div>
          <div class="field"><label for="base" data-t="base"></label><input type="text" id="base" autocomplete="off"></div>
          <div class="row">
            <div class="field"><label for="model" data-t="model"></label><input type="text" id="model" data-t-ph="modelPh" autocomplete="off"></div>
            <div class="field"><label for="key" data-t="key"></label><input type="password" id="key" data-t-ph="keyPh" autocomplete="off"></div>
          </div>
          <div class="row"><button type="button" class="primary" id="send" data-t="send"></button><span class="status" id="apiStatus"></span></div>
          <div class="answer" id="answer" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel">
        <h2><span class="n">5</span><span data-t="s5"></span></h2>
        <p class="note" data-t="s5note"></p>
        <textarea id="mine" data-t-ph="s5ph"></textarea>
      </section>

      <details>
        <summary data-t="assumeTitle"></summary>
        <ul id="assume"></ul>
      </details>
    </div>
  </div>

  <p class="foot"><span data-t="foot"></span><br><span data-t="credit"></span></p>
</main>

        questions: ['留给你的问题', '两到三个问题，请你对照自己的直觉思考。']
      },
      P: {
        intro: '你是一个帮助用户全面思考一件事的助手。你的任务不是替用户做决定，而是帮助用户看到这件事更多相关的方面，知道还应该问什么。',
        structure: '请按以下结构回答，每一部分使用小标题：',
        facts: '事实与信息缺口：区分用户描述中的已知事实、推测和情绪；列出在做出判断前最需要补充的信息。',
        people: '相关的人：这件事牵涉哪些人或群体？他们各自可能的立场、利益和感受是什么？',
        causes: '原因的层次：分别从个人层面、人际关系层面、制度或结构层面，说明可能的原因。',
        lenses: '领域视角：从指定的领域出发，说明每个领域会关注什么、会提出什么问题。若某个领域内存在不同的学派或观点，至少列出两种，并以其支持者会认可的方式公平地陈述。',
        values: '价值考量：以问题的形式列出这件事涉及的价值问题，例如：有没有撤不回的后果？代价由谁承担？有没有人被当作达成目的的手段？各方的选择权是否被尊重？再简要说明几种伦理视角（重视后果、重视规则与权利、重视品格、重视关怀与关系）会如何看待。不要替用户选择价值立场。',
        options: '可选的行动与代价：列出几种可行的做法，说明每种做法的代价、风险，以及是否可以撤回或修正。',
        limits: '不确定与边界：指出你不确定或可能出错的地方。如果涉及健康、法律、财务、人身安全或心理危机，明确建议用户咨询相关专业人士或及时求助。',
        questions: '留给用户的问题：最后提出两到三个问题，请用户对照自己的直觉和价值观思考。',
        lensesSet: l => `指定的领域：${l.join('、')}。`,
        lensesNone: '用户没有指定领域，请你挑选与这件事最相关的两到三个领域，并说明为什么选它们。',
        valuesSet: v => `用户提供了自己的价值原则，请在“价值考量”中对照这些原则分析，同时仍然呈现其他观点，不要只顺着用户的原则说：\n「${v}」`,
        req: full => '要求：使用用户所用的语言和平实的表达；' + (full ? '每部分可以展开说明；' : '每部分只写最重要的要点，保持简短；') + '不要编造具体的数据、法律条文或文献，不确定时请说明；对你不赞同的观点，也要公平地陈述。',
        account: '用户描述的事情：', blank: '（用户尚未填写）'
      }
    }
  };
  const STEP_KEYS = ['facts', 'people', 'causes', 'lenses', 'values', 'options', 'limits', 'questions'];

  let lang = (location.hash === '#zh' || store.get('pm-lang') === 'zh') && location.hash !== '#en' ? 'zh' : 'en';
  const lensChecked = new Set(), stepOff = new Set();

  function renderControls() {
    const L = T[lang];
    $('lenses').replaceChildren(...L.lenses.map(([name, hint], i) => {
      const lab = document.createElement('label'); lab.className = 'chip'; lab.title = hint;
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.id = 'lens-' + i; inp.checked = lensChecked.has(i);
      inp.addEventListener('change', () => { inp.checked ? lensChecked.add(i) : lensChecked.delete(i); refresh(); });
      const sp = document.createElement('span'); sp.textContent = name;
      lab.append(inp, sp); return lab;
    }));
    $('steps').replaceChildren(...STEP_KEYS.map(k => {
      const [name, hint] = L.steps[k];
      const lab = document.createElement('label'); lab.className = 'step';
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.id = 'step-' + k; inp.checked = !stepOff.has(k);
      inp.addEventListener('change', () => { inp.checked ? stepOff.delete(k) : stepOff.add(k); refresh(); });
      const sp = document.createElement('span'); sp.textContent = name;
      const sm = document.createElement('small'); sm.textContent = hint; sp.append(sm);
      lab.append(inp, sp); return lab;
    }));
    $('assume').replaceChildren(...L.assume.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));
  }

  function applyLang(next) {
    const prevSample = T[lang].sample;
    lang = next; store.set('pm-lang', lang);
    const L = T[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = L.title;
    document.querySelectorAll('[data-t]').forEach(n => { n.textContent = L[n.dataset.t]; });
    document.querySelectorAll('[data-t-ph]').forEach(n => { n.placeholder = L[n.dataset.tPh]; });
    document.querySelectorAll('[data-t-aria]').forEach(n => { n.setAttribute('aria-label', L[n.dataset.tAria]); });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    const ev = $('event');
    if (!ev.value.trim() || ev.value.trim() === prevSample) ev.value = L.sample;
    $('copyStatus').textContent = ''; $('apiStatus').textContent = '';
    renderControls(); refresh();
  }

  function buildPrompt() {
    const L = T[lang], P = L.P;
    const event = $('event').value.trim();
    const lenses = [...lensChecked].sort((a, b) => a - b).map(i => L.lenses[i][0]);
    const steps = STEP_KEYS.filter(k => !stepOff.has(k));
    const values = $('values').value.trim();
    const parts = [P.intro, P.structure];
    steps.forEach((k, i) => parts.push(`${i + 1}. ${P[k]}`));
    if (steps.includes('lenses')) parts.push(lenses.length ? P.lensesSet(lenses) : P.lensesNone);
    if (values) parts.push(P.valuesSet(values));
    parts.push(P.req($('depth').value === 'full'));
    parts.push('——', P.account, event || P.blank);
    return parts.join('\n');
  }

  function refresh() {
    $('prompt').value = buildPrompt();
    $('sampleRow').hidden = $('event').value.trim() !== T[lang].sample;
  }

  $('event').addEventListener('input', refresh);
  $('values').addEventListener('input', refresh);
  $('depth').addEventListener('change', refresh);
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== lang) applyLang(b.dataset.lang); }));

  $('mine').value = store.get('pm-mine');
  $('mine').addEventListener('input', e => store.set('pm-mine', e.target.value));

  $('copy').addEventListener('click', () => {
    const t = $('prompt').value, s = $('copyStatus'), L = T[lang];
    try { navigator.clipboard.writeText(t).then(() => { s.textContent = L.copied; }, () => { $('prompt').select(); s.textContent = L.selected; }); }
    catch (e) { $('prompt').select(); s.textContent = L.selected; }
  });

  const tabs = [['tab-prompt', 'pane-prompt'], ['tab-api', 'pane-api']];
  tabs.forEach(([t]) => $(t).addEventListener('click', () => tabs.forEach(([t2, p2]) => { const on = t2 === t; $(t2).setAttribute('aria-selected', String(on)); $(p2).hidden = !on; })));

  const DEFAULT_BASE = { openai: 'https://api.openai.com/v1', anthropic: 'https://api.anthropic.com' };
  $('base').value = DEFAULT_BASE.openai;
  $('kind').addEventListener('change', () => { $('base').value = DEFAULT_BASE[$('kind').value]; });

  async function callModel(kind, base, key, model, prompt) {
    base = base.replace(/\/+$/, '');
    if (kind === 'anthropic') {
      const r = await fetch(base + '/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model, max_tokens: 3000, messages: [{ role: 'user', content: prompt }] }) });
      const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message || ('HTTP ' + r.status));
      return (d.content || []).map(c => c.text || '').join('');
    }
    const headers = { 'content-type': 'application/json' }; if (key) headers.authorization = 'Bearer ' + key;
    const r = await fetch(base + '/chat/completions', { method: 'POST', headers, body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }] }) });
    const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message || ('HTTP ' + r.status));
    return d?.choices?.[0]?.message?.content || '';
  }

  $('send').addEventListener('click', async () => {
    const s = $('apiStatus'), out = $('answer'), L = T[lang];
    const model = $('model').value.trim();
    if (!model) { s.className = 'status err'; s.textContent = L.needModel; return; }
    s.className = 'status'; s.textContent = L.waiting; out.textContent = '';
    try {
      const text = await callModel($('kind').value, $('base').value.trim(), $('key').value.trim(), model, buildPrompt());
      out.textContent = text || L.empty; s.textContent = L.done;
    } catch (e) {
      s.className = 'status err';
      s.textContent = L.failed + (e && e.message ? e.message : L.unknown) + L.failHelp;
    }
  });

  applyLang(lang);
})();
</script>

</body>
</html>
